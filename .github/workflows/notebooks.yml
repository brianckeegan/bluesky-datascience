# Weekly check that the tutorials still run against the live Bluesky API.
#
# Runs without credentials, on purpose: AGENTS.md requires every Python
# notebook to complete against the unauthenticated public AppView, so that is
# the path that must never break. Failures here usually mean the platform, a
# pinned library, or an external service changed (see issue #7 for the
# review that motivated this workflow).
name: Notebooks

on:
  schedule:
    - cron: "23 19 * * 1"   # Mondays 19:23 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - "Notebooks/**"
      - "RMarkdown/**"
      - "requirements*.txt"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/notebooks.yml"

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install pinned dependencies
        run: pip install -r requirements-dev.txt

      - name: Bot safety tests
        run: python -m pytest tests/ -v

      # Prose checks (no network): no prose about the retired case-study
      # account or numbers quoted from one run (#9), no links to the retired
      # docs.bsky.app (#12)
      - name: Stale prose and retired documentation links
        run: |
          python scripts/check_stale_prose.py
          python scripts/rewrite_doc_links.py --check

      - name: Execute every notebook against the live API
        run: |
          mkdir -p "$RUNNER_TEMP/executed"
          find Notebooks -name "Part *.ipynb" -not -path "*/.ipynb_checkpoints/*" | sort | while read -r nb; do
            echo "::group::$nb"
            jupyter nbconvert --to notebook --execute --allow-errors \
              --ExecutePreprocessor.timeout=1200 \
              --output-dir "$RUNNER_TEMP/executed" "$nb"
            echo "::endgroup::"
          done

      - name: Fail on errors or deprecation warnings in the outputs
        run: python scripts/check_notebook_outputs.py "$RUNNER_TEMP"/executed/*.ipynb

      - name: Keep the executed notebooks for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: executed-notebooks
          path: ${{ runner.temp }}/executed/

  # External links change for reasons unrelated to a pull request, so this
  # runs on the weekly schedule (and by hand), not on every PR
  links:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check every external link
        run: python scripts/check_links.py

  r:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.3"

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::bskyr
            any::tidyverse
            any::jsonlite
            any::igraph
            any::tidytext
            any::topicmodels
            any::reshape2
            any::rmarkdown
            any::digest
            any::websocket
            any::sandwich
            any::lmtest
            any::broom
            any::httr2
            any::curl
            any::withr
            any::testthat
            any::pak

      # Offline tests of the shared helpers in bsky_client.R, run against a
      # saved API response, first with CRAN bskyr and then with the
      # development version from GitHub, so a bskyr change that breaks the
      # documents shows up here before it reaches CRAN.
      - name: Helper tests (CRAN bskyr)
        run: Rscript -e 'testthat::test_dir("RMarkdown/tests/testthat", stop_on_failure = TRUE)'

      - name: Helper tests (development bskyr)
        run: |
          mkdir -p "$RUNNER_TEMP/bskyr-dev"
          Rscript -e 'pak::pkg_install("christopherkenny/bskyr", lib = Sys.getenv("DEV_LIB"))'
          R_LIBS="$RUNNER_TEMP/bskyr-dev" Rscript -e 'message("bskyr ", packageVersion("bskyr")); testthat::test_dir("RMarkdown/tests/testthat", stop_on_failure = TRUE)'
        env:
          DEV_LIB: ${{ runner.temp }}/bskyr-dev

      # The student path: no credentials, so most API chunks are skipped
      - name: Render every R Markdown document (no credentials)
        run: Rscript scripts/check_rmarkdown.R

      # The API code itself, through the mock in RMarkdown/tests/mock_api.R:
      # a fake login, reads served by the public AppView, writes refused
      - name: Render every R Markdown document (mock API)
        run: Rscript scripts/check_rmarkdown.R --mock-api
        env:
          RENDER_DIR: ${{ runner.temp }}/rendered

      - name: Keep the rendered documents for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-rmarkdown
          path: ${{ runner.temp }}/rendered/
